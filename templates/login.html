{% extends "base.html" %}
{% block title %}Login – Splight{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
  <div class="card">
    <h1 style="text-align:center; margin-bottom:20px;">Welcome back</h1>

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" name="username" id="username" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Log in</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:0.88em; color:var(--text-muted);">
      Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--primary);">Register</a>
    </p>
    <p style="text-align:center; margin-top:8px; font-size:0.85em; color:var(--text-muted);">
      <a href="{{ url_for('forgot_password') }}" style="color:var(--primary);">Forgot password?</a>
      &nbsp;·&nbsp;
      <a href="{{ url_for('resend_verification') }}" style="color:var(--primary);">Resend confirmation</a>
    </p>
  </div>
</div>
{% endblock %}
