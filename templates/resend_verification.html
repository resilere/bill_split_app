{% extends "base.html" %}
{% block title %}Resend Confirmation – Splight{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
  <div class="card">
    <h1 style="text-align:center; margin-bottom:10px;">Resend confirmation</h1>
    <p class="page-subtitle" style="text-align:center;">
      We'll resend the confirmation link if your account isn't confirmed yet.
    </p>

    <form method="POST" action="{{ url_for('resend_verification') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" name="email" id="email" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Resend link</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:0.88em;">
      <a href="{{ url_for('login') }}" style="color:var(--primary);">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
